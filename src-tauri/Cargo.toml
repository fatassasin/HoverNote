[package]
name = "hovernote"
version = "0.1.0"
description = "HoverNote — 桌面角落的悬浮便签"
authors = ["shawn"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hovernote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
