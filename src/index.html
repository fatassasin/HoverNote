<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>HoverNote</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/panel.css" />
  </head>
  <body>
    <!-- 八向缩放热区，压在最上层，贴边 6px 内触发 -->
    <div class="rz n" data-dir="North"></div>
    <div class="rz s" data-dir="South"></div>
    <div class="rz w" data-dir="West"></div>
    <div class="rz e" data-dir="East"></div>
    <div class="rz nw" data-dir="NorthWest"></div>
    <div class="rz ne" data-dir="NorthEast"></div>
    <div class="rz sw" data-dir="SouthWest"></div>
    <div class="rz se" data-dir="SouthEast"></div>

    <div class="shell">
      <!-- Ctrl+F 从顶上浮下来的一小片。不横跨整条顶边：它是个临时的东西，
           占满两侧会把顶栏整个盖掉，看着像换了个界面。关掉按 Esc。 -->
      <div class="find" id="find">
        <input
          class="q"
          id="findq"
          type="text"
          placeholder="查找"
          spellcheck="false"
          autocomplete="off"
          aria-label="在这篇笔记里查找"
        />
        <button class="btn" id="findprev" aria-label="上一处">
          <svg class="ico" viewBox="0 0 18 18" width="12" height="12" aria-hidden="true">
            <path d="M4.8 10.8 9 6.6l4.2 4.2" />
          </svg>
        </button>
        <button class="btn" id="findnext" aria-label="下一处">
          <svg class="ico" viewBox="0 0 18 18" width="12" height="12" aria-hidden="true">
            <path d="M4.8 7.2 9 11.4l4.2-4.2" />
          </svg>
        </button>
      </div>

      <div class="topbar" data-tauri-drag-region>
        <!-- 左上角脱出的书签：悬停向下拉出笔记栏 -->
        <button class="tabmark" id="tabmark" aria-label="笔记列表">
          <svg class="ico" viewBox="0 0 18 18" width="14" height="14" aria-hidden="true">
            <path d="M4.5 7 9 11.4 13.5 7" />
          </svg>
        </button>

        <button class="ctl" id="expand" aria-label="放大到屏幕中心">
          <svg class="ico" viewBox="0 0 18 18" width="15" height="15" aria-hidden="true">
            <g class="ico-out">
              <path d="M7.6 4H4v3.6" />
              <path d="M10.4 14H14v-3.6" />
            </g>
            <g class="ico-in">
              <path d="M4.2 7.8h3.6V4.2" />
              <path d="M13.8 10.2h-3.6v3.6" />
            </g>
          </svg>
        </button>
      </div>

      <section class="drawer" id="drawer" aria-label="所有笔记">
        <ul class="notes" id="notes"></ul>
        <!-- 拖拽时的插入位置指示线。绝对定位在抽屉里（抽屉是滚动容器，
             它会跟着内容一起滚），拖完就藏起来。 -->
        <div class="dropline" id="dropline" aria-hidden="true"></div>
        <!-- 列表末尾的新建行。右下角那枚圆形加号也能新建，但翻着列表的时候
             手已经在这儿了，不该再把鼠标甩到对角去。 -->
        <button class="addrow" id="addrow">
          <svg class="ico" viewBox="0 0 18 18" width="12" height="12" aria-hidden="true">
            <path d="M9 4.4v9.2" />
            <path d="M4.4 9h9.2" />
          </svg>
          <span class="label">新建笔记</span>
        </button>
      </section>

      <main class="editor">
        <!-- 正文就是渲染后的样子：符号留在文本里淡显，光标落到哪行哪行的符号恢复
             正常亮度。contenteditable 的取值在 panel.js 里会升级成 plaintext-only，
             那个取值万一不被支持会让整块变成不可编辑，所以这里先写稳妥的 true。 -->
        <div
          class="doc"
          id="editor"
          contenteditable="true"
          spellcheck="false"
          autocorrect="off"
          role="textbox"
          aria-multiline="true"
          aria-label="笔记正文"
        ></div>
      </main>

      <button class="fab" id="add" aria-label="新建笔记">
        <svg class="ico" viewBox="0 0 18 18" width="16" height="16" aria-hidden="true">
          <path d="M9 4.4v9.2" />
          <path d="M4.4 9h9.2" />
        </svg>
      </button>
    </div>

    <script src="js/markdown.js"></script>
    <script src="js/panel.js"></script>
  </body>
</html>
